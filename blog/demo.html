<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Flexbox Demo</title>

<style>
body{
  font-family: Arial;
  text-align:center;
}

.container{
  display:flex;
  gap:30px;   
  justify-content:center;
  margin-top:50px;
}

.box{
  width:100px;
  height:100px;
  background:lightblue;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
}
</style>
</head>

<body>
    <h2>Flexbox gap property demo</h2>

    <div class="container">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    </div>
</body>
</html>
